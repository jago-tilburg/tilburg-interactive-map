<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{email_titel}}</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <style>* { font-family: Arial, sans-serif !important; }</style>
  <![endif]-->
  <style>
    html, body { margin:0 !important; padding:0 !important; width:100% !important; }
    body { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table { border-collapse:collapse !important; mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; display:block; }
    a { color:#f18b00; }
    a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; font-size:inherit !important; font-family:inherit !important; font-weight:inherit !important; line-height:inherit !important; }
    u + #body a { color:inherit; text-decoration:none; font-size:inherit; font-weight:inherit; line-height:inherit; }
    @media screen and (max-width:620px) {
      .wrap { width:100% !important; }
      .px { padding-left:24px !important; padding-right:24px !important; }
      .btn-a { display:block !important; text-align:center !important; }
      .h1 { font-size:24px !important; line-height:32px !important; }
      .mark { font-size:19px !important; line-height:24px !important; letter-spacing:1px !important; }
      .hbar { padding:18px 22px !important; }
    }
    @media (prefers-color-scheme: dark) {
      .bg-page { background-color:#1b1613 !important; }
      .bg-card { background-color:#241d19 !important; border-color:#3a2f28 !important; }
      .bg-soft { background-color:#2e2520 !important; border-color:#3a2f28 !important; }
      .t-dark { color:#f6efe9 !important; }
      .t-muted { color:#b5a79d !important; }
      .hr { border-color:#3a2f28 !important; }
    }
  </style>
</head>

<body id="body" class="bg-page" style="margin:0; padding:0; background-color:#fff8ef;">

  <div style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">
    {{preheader_tekst}}
    &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg-page" style="background-color:#fff8ef;">
    <tr>
      <td align="center" style="padding:32px 12px 48px 12px;">
        <table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

          <!-- KAART -->
          <tr>
            <td class="bg-card" style="background-color:#ffffff; border:1px solid #f0e4d3; border-radius:20px; overflow:hidden;">

              <!-- ============ HEADERBALK (groen -> oranje verloop, zoals op de site) ============ -->
              <!--[if gte mso 9]>
              <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:598px; height:72px;">
                <v:fill type="gradient" color="#3fae2a" color2="#f18b00" angle="270" />
                <v:textbox inset="28px,0,28px,0"><![endif]-->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#3fae2a; background-image:linear-gradient(90deg, #3fae2a 0%, #86a221 48%, #f18b00 100%); border-radius:20px 20px 0 0;">
                <tr>
                  <td class="hbar" style="padding:22px 28px; border-radius:20px 20px 0 0;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="left" valign="middle">
                          <a href="{{site_url}}" style="text-decoration:none;">
                            <span class="mark" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:23px; line-height:28px; font-weight:800; letter-spacing:1.4px; color:#ffffff; text-transform:uppercase;">2&nbsp;Happies&nbsp;bij</span>
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <!--[if gte mso 9]></v:textbox></v:rect><![endif]-->

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                <!-- BADGE + Titel -->
                <tr>
                  <td class="px" style="padding:36px 40px 0 40px;">

                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 14px 0;">
                      <tr>
                        <td class="bg-soft" style="background-color:#fffaf2; border:1px solid #f3e7d5; border-radius:999px; padding:6px 14px;">
                          <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:12px; line-height:16px; font-weight:800; letter-spacing:0.6px; color:#f18b00; text-transform:uppercase;">{{badge_tekst}}</span>
                        </td>
                      </tr>
                    </table>

                    <h1 class="h1 t-dark" style="margin:0 0 12px 0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:28px; line-height:36px; font-weight:800; letter-spacing:-0.4px; color:#1f1a17;">
                      {{titel}}
                    </h1>

                    <p class="t-muted" style="margin:0 0 26px 0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:16px; line-height:26px; color:#5c534d;">
                      {{intro_tekst}}
                    </p>
                  </td>
                </tr>

                <!-- INFOBLOK -->
                <tr>
                  <td class="px" style="padding:0 40px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg-soft" style="background-color:#fffaf2; border:1px solid #f3e7d5; border-radius:16px;">
                      <tr>
                        <td style="padding:18px 22px;">
                          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                              <td width="96" class="t-muted" style="padding:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:14px; line-height:22px; color:#8a7d75;">{{regel_label}}</td>
                              <td class="t-dark" style="padding:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:14px; line-height:22px; font-weight:600; color:#3a322d;">{{regel_waarde}}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- CTA -->
                <tr>
                  <td class="px" style="padding:26px 40px 0 40px;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{cta_url}}" style="height:48px;v-text-anchor:middle;width:210px;" arcsize="50%" stroke="f" fillcolor="#f18b00">
                      <w:anchorlock/>
                      <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">{{cta_tekst}}</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-- -->
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#f18b00" style="background-color:#f18b00; border-radius:999px;">
                          <a class="btn-a" href="{{cta_url}}" style="display:inline-block; padding:14px 32px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:16px; line-height:20px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:999px;">{{cta_tekst}}</a>
                        </td>
                      </tr>
                    </table>
                    <!--<![endif]-->
                  </td>
                </tr>

                <!-- AFSLUITING -->
                <tr>
                  <td class="px" style="padding:30px 40px 36px 40px;">
                    <p class="t-muted" style="margin:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:15px; line-height:24px; color:#5c534d;">
                      {{afsluit_tekst}}<br />
                      <span style="color:#8a7d75;">Team 2 Happies bij</span>
                    </p>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td class="px" style="padding:26px 24px 0 24px;" align="center">
              <p class="t-muted" style="margin:0 0 14px 0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:13px; line-height:20px; color:#9c8f86;">
                <a href="{{site_url}}" style="color:#9c8f86; text-decoration:underline;">2happies.nl</a>
                &nbsp;&middot;&nbsp;
                <a href="{{help_url}}" style="color:#9c8f86; text-decoration:underline;">Hulp nodig?</a>
                &nbsp;&middot;&nbsp;
                <a href="{{voorkeuren_url}}" style="color:#9c8f86; text-decoration:underline;">E-mailvoorkeuren</a>
              </p>
              <p class="t-muted" style="margin:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#b5a79d;">
                &copy; {{jaar}} 2 Happies bij
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
