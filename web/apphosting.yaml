runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpuAlwaysAllocated: false

env:
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: tilburg-interactive-map-5710f.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://tilburg-interactive-map-5710f-default-rtdb.europe-west1.firebasedatabase.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: tilburg-interactive-map-5710f
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: tilburg-interactive-map-5710f.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "451533571295"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:451533571295:web:e3efd663e42e8df0e7d56a"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-api-key-staging
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: google-maps-api-key-staging
    availability: [BUILD, RUNTIME]
  # Own dedicated GA4 property for staging — see GO-LIVE-CHECKLIST.md §7. A
  # real prod measurement ID (G-V0S98HPQ52) sat here from 2026-08-23 until
  # 2026-09-03, which meant staging traffic that accepted analytics consent
  # was sending real events into prod's actual GA4 property. This is a
  # separate property ("2happies (staging)", manually installed — NOT linked
  # to/sharing prod's Google tag), created 2026-09-03. Do not set this to
  # prod's ID.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-FL4WNQ0BW0
    availability: [BUILD, RUNTIME]
